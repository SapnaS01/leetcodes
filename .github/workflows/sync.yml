name: Sync Leetcode
on:
  workflow_dispatch: # Allows manual trigger
  schedule:
    - cron: "30 9 * * *" # Runs automatically every day
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare LeetCode Sync action
        uses: actions/checkout@v5
        with:
          repository: joshcai/leetcode-sync
          ref: 6749b872e89b3c10d213a6e599a7424584c1fa10
          path: .github/actions/leetcode-sync

      - name: Handle empty LeetCode submission responses
        working-directory: .github/actions/leetcode-sync
        run: |
          node -e "const fs=require('fs'); const file='dist/index.js'; let source=fs.readFileSync(file,'utf8'); const submissionLoop='for (const submission of response.data.data.submissionList.submissions)'; const safeSubmissionLoop='for (const submission of response.data?.data?.submissionList?.submissions ?? [])'; const pagination='response.data.data.submissionList.hasNext'; const safePagination='response.data?.data?.submissionList?.hasNext === true'; if (!source.includes(submissionLoop) || !source.includes(pagination)) throw new Error('Unexpected leetcode-sync bundle'); source=source.replace(submissionLoop,safeSubmissionLoop).replace(pagination,safePagination); fs.writeFileSync(file,source); const metadata='action.yml'; let action=fs.readFileSync(metadata,'utf8'); if (!action.includes('using: node20')) throw new Error('Unexpected action metadata'); fs.writeFileSync(metadata,action.replace('using: node20','using: node24'));"

      - name: Sync
        uses: ./.github/actions/leetcode-sync
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
